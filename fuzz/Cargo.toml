# Fuzz targets (cargo-fuzz, needs a nightly toolchain): see CONTRIBUTING.md.
# Its own workspace, so that the main crate and its MSRV are not affected.
[workspace]

[package]
name = "spillgate-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
spillgate = { path = "..", features = ["br", "zstd"] }

[[bin]]
name = "gzip"
path = "fuzz_targets/gzip.rs"
test = false
doc = false

[[bin]]
name = "deflate"
path = "fuzz_targets/deflate.rs"
test = false
doc = false

[[bin]]
name = "br"
path = "fuzz_targets/br.rs"
test = false
doc = false

[[bin]]
name = "zstd"
path = "fuzz_targets/zstd.rs"
test = false
doc = false

[[bin]]
name = "chain"
path = "fuzz_targets/chain.rs"
test = false
doc = false

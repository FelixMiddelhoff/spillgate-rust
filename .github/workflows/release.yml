name: release

# Publishes to crates.io. Runs only for a tag like v0.1.0 that the maintainer pushes: checks that the
# tag equals the crate version, runs the whole suite, packages, and publishes from a protected
# environment. With crates.io trusted publishing (OIDC) no token is stored; see RELEASING.md for
# the one-time setup and the first release (which needs a token, because trusted publishing is
# configured on an existing crate).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: the tag must equal the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='spillgate'][0])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: the whole suite, all features, no skipped vector
        run: cargo test --locked --workspace --release --all-features
        env:
          SPILLGATE_NO_SKIPS: "1"
      - name: retained memory
        run: cargo test --manifest-path tools/alloc-check/Cargo.toml
      - run: cargo test --locked --test spectrace
      - name: package
        run: cargo package --locked
      - name: the packaged crate works in a clean project
        run: |
          set -eu
          mkdir /tmp/unpacked && tar -xzf target/package/spillgate-*.crate -C /tmp/unpacked
          cargo new --bin /tmp/consumer
          cd /tmp/consumer
          cargo add spillgate --path /tmp/unpacked/spillgate-* --features br,zstd
          cat > src/main.rs <<'RS'
          fn main() {
              let out = spillgate::decode_all(&b"ok"[..], &[], spillgate::Limits::new(100)).unwrap();
              println!("{}", String::from_utf8_lossy(&out));
          }
          RS
          cargo run --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: target/package/spillgate-*.crate
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The environment "crates-io" is created in the repository settings and requires the
    # maintainer's approval before this job runs.
    environment:
      name: crates-io
      url: https://crates.io/crates/spillgate
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io trusted publishing
    env:
      FIRST_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: get a short-lived token (trusted publishing); skipped while a first-release token secret exists
        id: auth
        if: env.FIRST_RELEASE_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: publish
        run: cargo publish --locked
        env:
          # The token of the trusted-publishing exchange; the secret only exists for the first
          # release (RELEASING.md, step 3) and is deleted afterwards.
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

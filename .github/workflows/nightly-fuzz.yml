name: nightly-fuzz

# Coverage-guided fuzzing of every codec and of chains through the public API. Each target asserts
# no panic, no internal error and no more output than the limit.
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [gzip, deflate, br, zstd, chain]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event.inputs.seconds || '300' }} -max_len=65536 -rss_limit_mb=2048
      - name: keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: all features in release, no vector may be skipped (unit, conformance, differential, memory, doc tests)
        run: cargo test --locked --workspace --release --all-features
        env:
          SPILLGATE_NO_SKIPS: "1"

  test-no-features:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: default features only (vectors that need br or zstd are skipped)
        run: cargo test --locked --workspace --release

  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.85 --profile minimal
      - name: the library builds with the minimum supported Rust version (default features only)
        run: cargo +1.85 build --locked --lib

  alloc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: retained memory with a counting allocator
        run: cargo test --manifest-path tools/alloc-check/Cargo.toml

  spectrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: every rule of the specification is covered
        run: cargo test --locked --test spectrace

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: rustdoc without warnings
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: the fuzz targets compile
        run: cargo +nightly fuzz build

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: known vulnerabilities in dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal
      - name: the package contents
        run: cargo package --locked --list
      - name: package and verify build
        run: cargo package --locked
      - name: the packaged crate works in a clean project
        run: |
          set -eu
          mkdir /tmp/unpacked && tar -xzf target/package/spillgate-*.crate -C /tmp/unpacked
          cargo new --bin /tmp/consumer
          cd /tmp/consumer
          cargo add spillgate --path /tmp/unpacked/spillgate-* --features br,zstd
          cat > src/main.rs <<'RS'
          fn main() {
              let gz: &[u8] = &[0x1f, 0x8b, 8, 0, 0, 0, 0, 0, 0, 255, 3, 0, 0, 0, 0, 0, 0, 0, 0, 0];
              let out = spillgate::decode_all(gz, &["gzip"], spillgate::Limits::new(1 << 20)).unwrap();
              assert!(out.is_empty());
              println!("pack ok");
          }
          RS
          cargo run --release

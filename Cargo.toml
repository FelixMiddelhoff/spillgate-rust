[workspace]
members = [".", "crates/test-support"]

[package]
name = "spillgate"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.85"
description = "Decode untrusted compressed data (gzip, deflate, brotli, zstd) with mandatory limits: decompression bombs end in typed errors."
license = "MIT"
repository = "https://github.com/FelixMiddelhoff/spillgate-rust"
readme = "README.md"
keywords = ["decompression", "gzip", "zstd", "brotli", "security"]
categories = ["compression", "web-programming::http-client", "web-programming::http-server"]
include = ["src/**", "README.md", "LICENSE", "CHANGELOG.md", "docs/**"]

[features]
default = []
# Optional codecs. gzip, deflate and identity are always available and have no dependency.
br = ["dep:brotli-decompressor"]
zstd = []

[dependencies]
# Pure Rust brotli decoder. Pinned exactly: a decoder update is a security-relevant change.
brotli-decompressor = { version = "=5.0.0", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
spillgate-test-support = { path = "crates/test-support" }
flate2 = "1"
sha2 = "0.11"
serde_json = "1"
zstd = "0.13"
# Reference brotli encoder (and reference decoder for differential tests); tests only.
brotli = { version = "8", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

# The reference encoder is C code; build it optimized even in debug test runs.
[profile.dev.package.zstd-sys]
opt-level = 3

# The reference brotli encoder and the decoder under test, optimized even in debug test runs.
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.brotli-decompressor]
opt-level = 3
